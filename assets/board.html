<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon 榜单看板 · __TITLE__</title>
<style>
  :root{
    --ink:#1f2937; --muted:#6b7280; --line:#dce1e8; --bg:#f7f8fa;
    --amz:#ff9900; --top3:#c2410c; --cyan:#0563c1;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:18px 20px 40px;background:var(--bg);color:var(--ink);
       font-family:"Microsoft YaHei","PingFang SC",-apple-system,Segoe UI,sans-serif}
  h1{margin:0 0 6px;font-size:22px;letter-spacing:.2px}
  .meta{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:4px}
  .meta b{color:var(--ink);font-weight:600}

  /* 日期切换 */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;align-items:center}
  .tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;
       padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.2}
  .tab:hover{border-color:#c3cad4}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
  .tab .n{font-size:11px;opacity:.62;margin-left:4px}
  .tab.on .n{opacity:.75}
  .tabs .hint{font-size:11.5px;color:var(--muted);margin-left:6px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:4px;white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 6px 10px;
        display:flex;flex-direction:column;align-items:center;text-align:center;
        transition:box-shadow .15s,transform .15s}
  .card:hover{box-shadow:0 6px 18px rgba(15,23,42,.10);transform:translateY(-2px)}
  .card.top3{border-color:var(--amz);box-shadow:0 0 0 1px var(--amz) inset}
  .pic{height:138px;display:flex;align-items:center;justify-content:center;width:100%}
  .pic img{max-width:126px;max-height:138px;object-fit:contain}
  .row{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding:0 4px;margin-top:8px}
  .rank{font:700 13px Arial,sans-serif;color:var(--muted)}
  .card.top3 .rank{color:var(--top3)}
  .price{font:700 12px Arial,sans-serif}
  .brand{font-size:12.5px;font-weight:700;margin-top:6px;width:100%;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta.color{white-space:normal;overflow:visible;text-overflow:clip;color:var(--muted);
             word-break:break-word;line-height:1.35;padding:0 3px}
  .meta.color .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
  .asin{font:11px Arial,sans-serif;color:var(--cyan);text-decoration:underline;margin-top:5px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
  footer{margin-top:26px;font-size:11.5px;color:var(--muted);line-height:1.9}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  @media(max-width:560px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
    .tabs{gap:4px}
    .tab{padding:5px 9px;font-size:12px}
  }
</style>
</head>
<body>
<h1 id="h1"></h1>
<div class="meta" id="meta"></div>
<div class="tabs" id="tabs"></div>
<div class="meta" id="stats"></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<footer id="foot"></footer>

<script>
/* DATA = {category, node, month, dates:[{date, crawled_at, items:[{rank,asin,brand,price_usd,color,img,chain}]}]} */
const DATA = __DATA__;

const COLOR_STYLE = {
  "黑色":["#1f2937","#fff"], "金色":["#c99a2e","#fff"], "渐变 / 挑染":["#0f9488","#fff"],
  "白色 / 银色":["#e5e7eb","#374151"], "粉色":["#ec4899","#fff"], "红 / 酒红":["#b91c1c","#fff"],
  "蓝色":["#2563eb","#fff"], "棕色":["#92400e","#fff"], "橙色":["#ea580c","#fff"],
  "紫色":["#7c3aed","#fff"], "绿色":["#059669","#fff"], "其他 / 未标注":["#f3f4f6","#6b7280"]
};
const SHORT = {"渐变 / 挑染":"渐变挑染","白色 / 银色":"白/银","红 / 酒红":"红/酒红","其他 / 未标注":"其他"};
const ORDER = Object.keys(COLOR_STYLE);
const $ = id => document.getElementById(id);

const dates = (DATA.dates || []).slice().sort((a,b)=> a.date < b.date ? -1 : 1);
let active = dates.length ? dates.length - 1 : -1;       // 默认停最新一天

/* ---- 日期切换条 ---- */
function renderTabs(){
  if (dates.length <= 1){ $("tabs").innerHTML = ""; return; }
  $("tabs").innerHTML = dates.map((d,i)=>
    `<button class="tab${i===active?" on":""}" data-i="${i}" type="button">`
    + `${d.date.slice(5)}<span class="n">${d.items.length}</span></button>`
  ).join("") + `<span class="hint">共 ${dates.length} 天（${dates[0].date} ~ ${dates[dates.length-1].date}）</span>`;
  document.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{ active = +btn.dataset.i; render(); });
  });
}

/* ---- 渲染选中日期 ---- */
const CUR_SYM = {USD:"$",GBP:"£",EUR:"€",JPY:"¥",CAD:"C$",AUD:"A$",INR:"₹",MXN:"MX$",
                 BRL:"R$",SEK:"kr",PLN:"zł",SGD:"S$",AED:"AED "};
const CUR = (DATA && DATA.currency) || "USD";
const SYM = CUR_SYM[CUR] || "";
const DEC = CUR === "JPY" ? 0 : 2;
const RANK_LABEL = (DATA && DATA.rank_label) || "Best Sellers";
const MARKET = (DATA && DATA.market) || "amazon.com";
const MK_LABEL = (DATA && DATA.market_label) || "";
const money = v => SYM + (v || 0).toFixed(DEC);

function render(){
  const day = dates[active];
  if (!day){ $("grid").innerHTML = '<div class="empty">本月暂无数据</div>'; return; }
  const items = day.items.slice().sort((a,b)=>a.rank-b.rank);

  $("h1").textContent = `Amazon ${MK_LABEL} ${RANK_LABEL} · ${DATA.category} · Top ${items.length}`;
  $("meta").innerHTML =
    `榜单日期 <b>${day.date}</b>${MARKET==="amazon.com"?"（美西）":""}｜数据源：${MARKET} ${RANK_LABEL} › ${DATA.category}`
    + `（node ${DATA.node}）｜抓取 ${day.crawled_at || "—"}`;

  const prices = items.map(x=>x.price_usd).filter(x=>x>0);
  const sum = prices.reduce((a,b)=>a+b,0), avg = prices.length ? sum/prices.length : 0;
  const sp = prices.slice().sort((a,b)=>a-b);
  const med = !sp.length ? 0 : (sp.length%2 ? sp[(sp.length-1)/2] : (sp[sp.length/2-1]+sp[sp.length/2])/2);
  const brandCnt = {};
  items.forEach(x=>{ if(x.brand) brandCnt[x.brand]=(brandCnt[x.brand]||0)+1; });
  const topBrand = Object.entries(brandCnt).sort((a,b)=>b[1]-a[1])[0] || ["—",0];

  $("stats").innerHTML =
    `均价 <b>${money(avg)}</b>　中位价 <b>${money(med)}</b>　价格带 `
    + `<b>${money(Math.min(...prices))} – ${money(Math.max(...prices))}</b>　`
    + `品牌数 <b>${Object.keys(brandCnt).length}</b>　头部品牌 <b>${topBrand[0]}</b>（${topBrand[1]} 席）`;

  // 颜色分布色条
  const cc = {};
  items.forEach(x=>{ cc[x.color]=(cc[x.color]||0)+1; });
  const chips = Object.entries(cc).sort((a,b)=> b[1]-a[1] || ORDER.indexOf(a[0])-ORDER.indexOf(b[0]));
  const pcts = chips.map(c=>Math.round(c[1]/items.length*100));
  const diff = 100 - pcts.reduce((a,b)=>a+b,0);
  if (diff) pcts[0] += diff;
  $("chips").innerHTML = chips.map((c,i)=>{
    const st = COLOR_STYLE[c[0]] || COLOR_STYLE["其他 / 未标注"];
    return `<span class="chip" style="background:${st[0]};color:${st[1]}">`
         + `${SHORT[c[0]]||c[0]} ${c[1]} · ${pcts[i]}%</span>`;
  }).join("");

  // 卡片
  $("grid").innerHTML = items.map(x=>{
    const st = COLOR_STYLE[x.color] || COLOR_STYLE["其他 / 未标注"];
    const chain = (x.chain || []).filter(Boolean);
    const img = x.img ? `<img src="${x.img}" alt="${(x.brand||"")}" loading="lazy"
        data-chain='${JSON.stringify(chain)}'
        onerror="const c=JSON.parse(this.dataset.chain||'[]'); if(c.length){this.src=c.shift(); this.dataset.chain=JSON.stringify(c);} else {this.style.display='none'}">` : "";
    return `<div class="card${x.rank<=3?" top3":""}">
      <div class="pic">${img}</div>
      <div class="row"><span class="rank">#${x.rank}</span>
        <span class="price">${money(x.price_usd)}</span></div>
      <div class="brand" title="${(x.brand||"").replace(/"/g,"&quot;")}">${x.brand||"—"}</div>
      <a class="asin" href="https://www.${MARKET}/dp/${x.asin}" target="_blank" rel="noopener">${x.asin}</a>
      <div class="meta color" style="margin-top:4px;font-size:11px"
           title="${x.color_src==='dp'?'商品页 Color 属性原文':'标题中的颜色表述'}">
        <span class="dot" style="background:${st[0]}"></span>${x.color_raw || "—"}</div>
    </div>`;
  }).join("");

  document.querySelectorAll(".tab").forEach(b=>{
    b.classList.toggle("on", +b.dataset.i === active);
  });
}

$("foot").innerHTML =
  `说明｜顶部日期按钮切换当月任意一天；排名为类目畅销榜自然位次，非搜索排名；`
  + `价格为美元实时售价，个别商品因配送区域限制不显示价格时取榜单卡片价。<br>`
  + `说明｜每月一个文件，当月每天的数据都在这份页面里（点日期切换）；跨月自动新建文件。`;

renderTabs();
render();
</script>
</body>
</html>
